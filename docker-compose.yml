name: kritzellm

# Shared by the three services built from backend/.
x-backend: &backend
  build: backend
  image: kritzellm-api:local
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  volumes:
    - api-data:/data

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kritzellm}:${POSTGRES_PASSWORD:-kritzellm}@db:5432/${POSTGRES_DB:-kritzellm}
  DATA_DIR: /data
  TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-}
  EMBED_MODEL: ${EMBED_MODEL:-}

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kritzellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kritzellm}
      POSTGRES_DB: ${POSTGRES_DB:-kritzellm}
    ports:
      # Only reachable from this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under a versioned subdirectory of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Brings the schema up to date, then exits. api waits for it.
  migrate:
    <<: *backend
    command: ["python", "-m", "kritzellm.db.migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment: *backend-env

  api:
    <<: *backend
    environment:
      <<: *backend-env
      API_TOKEN: ${API_TOKEN:-}
    ports:
      # Only reachable from this machine.
      - "127.0.0.1:${API_PORT:-8000}:8000"

  # Runs background jobs (processing uploaded pages) from the queue in the database.
  worker:
    <<: *backend
    command: ["python", "-m", "kritzellm.worker"]
    environment:
      <<: *backend-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # The image's healthcheck probes the API port; the worker has a heartbeat instead.
    healthcheck:
      test: ["CMD", "python", "-m", "kritzellm.worker", "healthcheck"]

  # The web app: nginx serves it and passes /api on to the api service.
  web:
    build: web
    image: kritzellm-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Only reachable from this machine.
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  db-data:
  api-data:
