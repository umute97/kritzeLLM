server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # One photo per upload request, 25 MB at most, plus the form around it.
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat answers will stream; don't hold them back.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the app, which routes in the browser.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
